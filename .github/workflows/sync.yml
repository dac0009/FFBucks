name: Sync sportsbook

# Every 15 minutes: reads the league site's lines file and hands it to the
# sportsbook database (new lines, lock times, grading). Never touches ESPN.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-sportsbook
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ffbucks-sportsbook

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ffbucks-sportsbook/package-lock.json
      - run: npm ci --omit=dev
      - name: Sync lines and results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/sync.mjs
